schema = 1

[topology]
package = "vehicle-topology"
entry = "vehicle_topology::topology"

[deployments.production.bindings.sensor]
package = "sensor-host"
features = ["simulated"]

[deployments.production.bindings.controller]
package = "vehicle-control"
[deployments.production.bindings.backup]
package = "vehicle-control"

[deployments.production.federates.host]
groups = ["placement/backup", "placement/controller", "placement/sensor"]
runtime = "std"
recovery = "fail-stop"

[deployments.runtime-failure]
bindings = { sensor = { package = "sensor-host", features = ["simulated", "runtime-failure"] }, controller = { package = "vehicle-control" }, backup = { package = "vehicle-control" } }

[deployments.runtime-failure.federates.host]
groups = ["placement/backup", "placement/controller", "placement/sensor"]
runtime = "std"
recovery = "fail-stop"

[deployments.execution]
bindings = { sensor = { package = "sensor-host", features = ["simulated"] }, controller = { package = "vehicle-control" }, backup = { package = "vehicle-control" } }

[deployments.execution.federates.host]
groups = ["placement/backup", "placement/controller", "placement/sensor"]
runtime = "std"
recovery = "fail-stop"

[deployments.execution.execution]
fast-forward = true
keep-alive = true
logical-horizon = "1000ms"

[deployments.execution-equivalent]
bindings = { sensor = { package = "sensor-host", features = ["simulated"] }, controller = { package = "vehicle-control" }, backup = { package = "vehicle-control" } }

[deployments.execution-equivalent.federates.host]
groups = ["placement/backup", "placement/controller", "placement/sensor"]
runtime = "std"
recovery = "fail-stop"

[deployments.execution-equivalent.execution]
fast-forward = true
keep-alive = true
logical-horizon = "1s"

[deployments.broken-payload.bindings.sensor]
package = "sensor-host"
features = ["simulated"]

[deployments.broken-payload.bindings.controller]
package = "vehicle-control"
features = ["broken-payload"]
[deployments.broken-payload.bindings.backup]
package = "vehicle-control"

[deployments.broken-payload.federates.host]
groups = ["placement/backup", "placement/controller", "placement/sensor"]
runtime = "std"
recovery = "fail-stop"

[deployments.warning-diagnostic.bindings.sensor]
package = "sensor-host"
features = ["simulated"]

[deployments.warning-diagnostic.bindings.controller]
package = "vehicle-control"
features = ["warning-diagnostic"]
[deployments.warning-diagnostic.bindings.backup]
package = "vehicle-control"

[deployments.warning-diagnostic.federates.host]
groups = ["placement/backup", "placement/controller", "placement/sensor"]
runtime = "std"
recovery = "fail-stop"

[deployments.broken-descriptor.bindings.sensor]
package = "sensor-host"
features = ["simulated"]

[deployments.broken-descriptor.bindings.controller]
package = "vehicle-control"
features = ["broken-descriptor"]
[deployments.broken-descriptor.bindings.backup]
package = "vehicle-control"

[deployments.broken-descriptor.federates.host]
groups = ["placement/backup", "placement/controller", "placement/sensor"]
runtime = "std"
recovery = "fail-stop"

[deployments.profile-config.bindings.sensor]
package = "sensor-host"
features = ["simulated"]

[deployments.profile-config.bindings.controller]
package = "vehicle-control"
features = ["profile-config-probe"]

[deployments.profile-config.bindings.backup]
package = "vehicle-control"

[deployments.profile-config.federates.host]
groups = ["placement/backup", "placement/controller", "placement/sensor"]
runtime = "std"
recovery = "fail-stop"
profile = "release"
cargo-config = ".cargo/profile-config.toml"

[deployments.resolution.bindings.sensor]
package = "sensor-host"
features = ["simulated"]

[deployments.resolution.bindings.controller]
package = "vehicle-control"
[deployments.resolution.bindings.backup]
package = "vehicle-control"

[deployments.resolution.federates.host]
groups = ["placement/backup", "placement/controller", "placement/sensor"]
target = "x86_64-unknown-linux-gnu"
runtime = "std"
recovery = "fail-stop"
target-json = "targets/host.json"
cargo-config = ".cargo/host.toml"

[deployments.foreign-x86-linux]
bindings = { sensor = { package = "sensor-host", features = ["simulated"] }, controller = { package = "vehicle-control" }, backup = { package = "vehicle-control" } }

[deployments.foreign-x86-linux.federates.host]
groups = ["placement/backup", "placement/controller", "placement/sensor"]
target = "x86_64-unknown-linux-gnu"
runtime = "std"
recovery = "fail-stop"

[deployments.foreign-aarch64-macos]
bindings = { sensor = { package = "sensor-host", features = ["simulated"] }, controller = { package = "vehicle-control" }, backup = { package = "vehicle-control" } }

[deployments.foreign-aarch64-macos.federates.host]
groups = ["placement/backup", "placement/controller", "placement/sensor"]
target = "aarch64-apple-darwin"
runtime = "std"
recovery = "fail-stop"

[deployments.outside-member.bindings."vehicle/sensor"]
package = "outside-member"

[deployments.outside-member.federates.host]
groups = ["vehicle"]
runtime = "std"
recovery = "fail-stop"

[deployments.payload-alias.bindings."vehicle/sensor"]
package = "sensor-host"
features = ["payload-alias"]
[deployments.payload-alias.federates.host]
groups = ["vehicle"]
runtime = "std"
recovery = "fail-stop"

[deployments.feature-union.bindings.controller]
package = "vehicle-control"
features = ["controller-selected"]
[deployments.feature-union.bindings.backup]
package = "vehicle-control"
features = ["sensor-selected"]
[deployments.feature-union.bindings.sensor]
package = "sensor-host"
features = ["simulated"]
[deployments.feature-union.federates.host]
groups = ["placement/backup", "placement/controller", "placement/sensor"]
runtime = "std"
recovery = "fail-stop"

[deployments.sensor-slice]
bindings = { sensor = { package = "sensor-host", features = ["simulated"] }, controller = { package = "vehicle-control" }, backup = { package = "vehicle-control" } }
federates = { host = { groups = ["placement/backup", "placement/controller"], runtime = "std", recovery = "fail-stop" }, sensor = { groups = ["placement/sensor"], runtime = "std", recovery = "fail-stop", cargo-config = ".cargo/sensor-slice.toml" } }
coordination = { backend = "central-rti" }
rti = { target = "aarch64-unknown-linux-gnu" }
boundaries."boundary/controller%2Fcommand/sensor%2Fcommand/c0" = { flow = "sensor-control", codec = "serde-json", transport = "tcp", failure-policy = "propagate-stop", transport-policy = "reliable-ordered-framed", codec-policy = "canonical-bounded", timing-policy = "best-effort", security-policy = "none" }

[deployments.transitive-peer]
bindings = { sensor = { package = "transitive-host" }, controller = { package = "vehicle-control" }, backup = { package = "vehicle-control" } }
federates = { host = { groups = ["placement/backup", "placement/controller"], runtime = "std", recovery = "fail-stop" }, sensor = { groups = ["placement/sensor"], runtime = "std", recovery = "fail-stop" } }
coordination = { backend = "central-rti" }
rti = { target = "aarch64-unknown-linux-gnu" }
boundaries."boundary/controller%2Fcommand/sensor%2Fcommand/c0" = { flow = "sensor-control", codec = "serde-json", transport = "tcp", failure-policy = "propagate-stop", transport-policy = "reliable-ordered-framed", codec-policy = "canonical-bounded", timing-policy = "best-effort", security-policy = "none" }
