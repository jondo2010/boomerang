name: CI

on:
  push:
    branches: ["main"]

  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Commitlint
    steps:
      - name: Run commitlint
        uses: opensource-nepal/commitlint@v1

  clippy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Clippy
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Configure Cargo target directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=target" >> "$GITHUB_ENV"
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Check with Clippy
        run: |
          cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    strategy:
      matrix:
        toolchain: [stable, nightly]
        os: [windows-latest, ubuntu-latest, macos-latest]

        # Only test nightly on Linux
        exclude:
          - os: macos-latest
            toolchain: nightly
          - os: windows-latest
            toolchain: nightly

    runs-on: ${{ matrix.os }}
    # Native application fixtures compile their metadata and payload through Cargo.
    timeout-minutes: ${{ matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable' && 60 || 30 }}

    steps:
      - uses: actions/checkout@v7
      - name: Configure Cargo target directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=target" >> "$GITHUB_ENV"
      - name: fetch Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: toolchain version
        run: cargo -vV

      - name: fetch dependencies
        run: cargo fetch

      - name: test workspace
        run: cargo test --workspace --verbose

      - name: test independent hosted runtime capabilities
        run: |
          cargo test -p boomerang_runtime --no-default-features
          cargo test -p boomerang_runtime --no-default-features --features hosted-manual-clock
          cargo test -p boomerang_runtime --no-default-features --features hosted-source-input
          cargo test -p boomerang_runtime --no-default-features --features external-clock

      - name: test optional monitor tooling
        run: cargo test -p cargo-boomerang --all-features --verbose

  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - name: Configure Cargo target directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=target" >> "$GITHUB_ENV"
      - name: fetch Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: miri
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Test with Miri
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: >-
          cargo +nightly miri nextest run
          -p boomerang -p boomerang_runtime -p boomerang_tinymap
          -E 'kind(test)'
