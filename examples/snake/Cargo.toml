[package]
name = "snake"
description = "Host topology declarations for the compiled Snake examples"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"

[features]
default = ["hosted"]
hosted = ["boomerang/hosted", "snake-game/hosted", "snake-keyboard/hosted"]
metadata = ["boomerang/hosted", "snake-game/metadata", "snake-keyboard/metadata"]

[dependencies]
boomerang = { path = "../../boomerang", default-features = false }
snake-game = { path = "game", default-features = false }
snake-keyboard = { path = "keyboard", default-features = false }
