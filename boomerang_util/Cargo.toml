[package]
name = "boomerang_util"
description = "Utilities for Boomerang"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true

[features]
default = []

## Hosted scheduler observation sampling and bounded UDP telemetry publication
hosted-telemetry = [
    "dep:boomerang_runtime",
    "dep:boomerang_telemetry",
    "dep:tokio",
]

## Native bounded coordination capture and shutdown export (no hosted formatter)
bounded-tracing = ["launcher", "dep:tracing-bounded", "boomerang_runtime/bounded-tracing"]

## Hosted streaming formatter and asynchronous output queue
hosted-tracing = ["launcher", "dep:tracing-appender", "dep:tracing-subscriber"]

## Support for built-in CLI/runner methods
runner = ["dep:clap", "dep:anyhow", "dep:boomerang"]

## Hosted process support for generated launchers
launcher = [
    "dep:boomerang_runtime",
    "boomerang_runtime/serde",
    "dep:serde",
    "dep:serde_json",
]

## Support for recording and replaying
replay = ["dep:boomerang", "boomerang/replay"]

## Test helper for fmt tracing with span lifecycle output
test-tracing = ["hosted-tracing"]

[dependencies]
anyhow = { version = "1.0", optional = true }
bincode = { version = "1.3", optional = true }
clap = { version = "4.2", features = ["derive", "env"], optional = true }
document-features = { workspace = true }
serde = { workspace = true, optional = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
tracing.workspace = true
tracing-bounded = { workspace = true, optional = true }
tracing-appender = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tokio = { version = "1", optional = true, features = ["rt", "sync", "net", "time", "macros"] }

boomerang = { workspace = true, optional = true }
boomerang_runtime = { workspace = true, optional = true }
boomerang_telemetry = { workspace = true, optional = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
