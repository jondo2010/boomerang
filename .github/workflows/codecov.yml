name: Code Coverage

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["codex/issue-272-clock", "main"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Cargo target directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=target" >> "$GITHUB_ENV"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Fetch dependencies
        run: cargo fetch

      - name: Collect workspace coverage
        run: >-
          cargo llvm-cov --no-report --all-features --workspace
          --exclude cargo-boomerang

      - name: Collect cargo-boomerang fast coverage
        run: >-
          cargo llvm-cov --no-clean -p cargo-boomerang --all-features
          --lib --bin cargo-boomerang --test manifest --test workspace

      - name: Collect generated-launcher smoke coverage
        run: >-
          cargo llvm-cov --no-clean -p cargo-boomerang --all-features
          --test toolchain --
          run::generated_monolith_cli_matches_owned_execution
          codegen::generated_external_clock_launcher_calls_selected_driver_and_executes
          codegen::generated_physical_inputs_resolve_declared_targets_and_execute --exact

      # Exercise the tool-owned facet cfg values independently of Cargo features.
      - name: Collect payload facet coverage
        run: >-
          RUSTFLAGS='--cfg boomerang_facet="payload"'
          cargo llvm-cov --no-clean -p boomerang --lib --no-default-features

      - name: Collect descriptor facet coverage
        run: >-
          RUSTFLAGS='--cfg boomerang_facet="descriptor"'
          cargo llvm-cov --no-clean -p boomerang --lib --no-default-features
          --features hosted

      - name: Generate LCOV report
        shell: bash
        run: |
          # Generated workspaces fall outside cargo-llvm-cov's object discovery.
          # Use Cargo outputs; publication tests deliberately corrupt bundled copies.
          objects=()
          while IFS= read -r -d '' launcher; do
            objects+=("-object=$launcher")
          done < <(find target/llvm-cov-target/tmp -path '*/b/*' -type f -name boomerang-static-launcher -print0)
          test "${#objects[@]}" -gt 0
          LLVM_COV_FLAGS="${objects[*]}" cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: true
          use_oidc: true
