[package]
name = "cargo-boomerang"
description = "Telemetry monitor for Boomerang applications"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
monitor = ["dep:boomerang_monitor", "dep:humantime", "dep:serde_json"]

[dependencies]
anyhow.workspace = true
clap = { version = "4.2", features = ["derive"] }
boomerang_monitor = { workspace = true, optional = true }
humantime = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
boomerang_telemetry.workspace = true

[[bin]]
name = "cargo-boomerang"
path = "src/main.rs"
