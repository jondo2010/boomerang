[package]
name = "snake-app"
description = "Cargo-native terminal Snake application"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
default-run = "snake"

[[bin]]
name = "snake"
path = "src/main.rs"
doc = false

[dependencies]
boomerang_runtime.workspace = true
tinymap.workspace = true
snake-game = { path = "../game", default-features = false, features = ["payload"] }
snake-keyboard = { path = "../keyboard", default-features = false, features = ["payload"] }

[build-dependencies]
boomerang_builder.workspace = true
boomerang_runtime.workspace = true
boomerang_codegen = { workspace = true, features = ["cargo-build"] }
snake = { path = "..", default-features = false, features = ["metadata"] }
snake-game = { path = "../game", default-features = false, features = ["metadata"] }
snake-keyboard = { path = "../keyboard", default-features = false, features = ["metadata"] }
