[package]
name = "physical-input"
description = "Minimal compiled physical-clock and timestamped-input example"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
boomerang = { path = "../../boomerang", default-features = false }
boomerang_runtime = { workspace = true, features = ["hosted-source-input", "hosted-manual-clock"] }
tinymap.workspace = true

[build-dependencies]
boomerang.workspace = true
boomerang_builder.workspace = true
boomerang_codegen = { path = "../../boomerang_codegen", features = ["cargo-build"] }
