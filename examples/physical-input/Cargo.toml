[package]
name = "physical-input"
description = "Minimal compiled physical-clock and timestamped-input example"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
boomerang.workspace = true
boomerang_runtime = { workspace = true, features = ["hosted-source-input", "hosted-manual-clock"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(boomerang_facet, values("descriptor", "payload"))'] }
