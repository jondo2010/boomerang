schema = 1

[topology]
package = "vehicle-topology"
entry = "vehicle_topology::topology"

[deployments.production.bindings.sensor]
package = "sensor-host"
component = "sensor"
features = ["simulated"]

[deployments.production.bindings.controller]
package = "vehicle-control"
component = "controller"
[deployments.production.bindings.backup]
package = "vehicle-control"
component = "controller"

[deployments.production.federates.host]
groups = ["placement/backup", "placement/controller", "placement/sensor"]
runtime = "std"
recovery = "fail-stop"

[deployments.sensor-slice]
bindings = { sensor = { package = "sensor-host", component = "sensor", features = ["simulated", "natural-quiescence"] }, controller = { package = "vehicle-control", component = "controller" }, backup = { package = "vehicle-control", component = "controller" } }
federates = { host = { groups = ["placement/backup", "placement/controller"], runtime = "std", recovery = "fail-stop" }, sensor = { groups = ["placement/sensor"], runtime = "std", recovery = "fail-stop", cargo-config = ".cargo/sensor-slice.toml" } }
coordination = { backend = "central-rti" }
rti = { target = "aarch64-unknown-linux-gnu" }
boundaries."boundary/controller%2Fcommand/sensor%2Fcommand/c0" = { flow = "sensor-control", codec = "serde-json", transport = "tcp", failure-policy = "propagate-stop", transport-policy = "reliable-ordered-framed", codec-policy = "canonical-bounded", timing-policy = "best-effort", security-policy = "none" }
