schema = 1

[topology]
package = "vehicle-topology"
entry = "vehicle::topology"

[deployments.production.federates.sensor]
groups = ["sensor"]
runtime = "std"
recovery = "fail-stop"

[deployments.production.federates.compute]
groups = ["control"]
runtime = "std"
recovery = "fail-stop"

[deployments.production.coordination]
backend = "central-rti"
