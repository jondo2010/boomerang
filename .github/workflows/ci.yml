name: CI

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["codex/issue-272-clock", "main", "codex/deployment-phase4-integration", "codex/deployment-phase5-integration", "codex/deployment-phase6-integration", "codex/deployment-phase6-conformance-model", "codex/phase6-bounded-*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Commitlint
    steps:
      - name: Run commitlint
        uses: opensource-nepal/commitlint@v1

  clippy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Clippy
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Configure Cargo target directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=target" >> "$GITHUB_ENV"
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Check with Clippy
        run: |
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          RUSTFLAGS='--cfg boomerang_facet="payload"' cargo clippy -p boomerang --lib --no-default-features -- -D warnings
          RUSTFLAGS='--cfg boomerang_facet="descriptor"' cargo clippy -p boomerang --lib --no-default-features --features hosted -- -D warnings

  test:
    strategy:
      matrix:
        toolchain: [stable, nightly]
        os: [windows-latest, ubuntu-latest, macos-latest]

        # Only test nightly on Linux
        exclude:
          - os: macos-latest
            toolchain: nightly
          - os: windows-latest
            toolchain: nightly

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - name: Configure Cargo target directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=target" >> "$GITHUB_ENV"
      - name: fetch Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: toolchain version
        run: cargo -vV

      - name: prime generated-workspace dependency cache
        run: cargo fetch

      - name: test workspace except cargo-boomerang
        run: cargo test --workspace --exclude cargo-boomerang --verbose

      - name: test hosted external physical clock
        run: cargo test -p boomerang_runtime --features external-clock

      - name: test cargo-boomerang fast targets
        run: >-
          cargo test -p cargo-boomerang --lib --bin cargo-boomerang
          --test manifest --test workspace --verbose

      # Generated builds dominate runtime (23 minutes on Windows). Exercise the
      # full suite once, and keep the CLI/owned-execution smoke test portable.
      - name: test cargo-boomerang toolchain
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
        run: cargo test -p cargo-boomerang --all-features --test toolchain -- --test-threads=1

      - name: smoke test cargo-boomerang toolchain
        if: matrix.os != 'ubuntu-latest' || matrix.toolchain != 'stable'
        run: >-
          cargo test -p cargo-boomerang --test toolchain --
          run::generated_monolith_cli_matches_owned_execution --exact

      - name: discard disposable fixture builds before caching
        shell: bash
        # Each test binary recreates these directories, so restoring them cannot help.
        run: rm -rf target/tmp/cargo-boomerang-fixtures

  embedded:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - name: Install Rust and bare-metal target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-none-softfloat
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Check allocator-free TinyMap examples
        run: >-
          cargo check -p boomerang_tinymap --no-default-features --examples
          --target aarch64-unknown-none-softfloat

      - name: Check target-neutral physical clock contract
        run: |
          clock_probe_dir="$RUNNER_TEMP/clock-types"
          mkdir -p "$clock_probe_dir/src"
          cat > "$clock_probe_dir/Cargo.toml" <<'EOF'
          [package]
          name = "clock-types"
          version = "0.0.0"
          edition = "2021"
          [dependencies]
          thiserror = { version = "2.0", default-features = false }
          EOF
          cat > "$clock_probe_dir/src/lib.rs" <<EOF
          #![no_std]
          #[path = "$GITHUB_WORKSPACE/boomerang_runtime/src/physical_time.rs"]
          pub mod physical_time;
          EOF
          cargo check --manifest-path "$clock_probe_dir/Cargo.toml" \
            --target aarch64-unknown-none-softfloat

  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - name: Configure Cargo target directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=target" >> "$GITHUB_ENV"
      - name: fetch Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: miri
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Test with Miri
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: >-
          cargo +nightly miri nextest run
          -p boomerang -p boomerang_runtime -p boomerang_tinymap
          -E 'kind(test)'
