schema = 1

[topology]
package = "physical-input"
entry = "physical_input::topology"

[deployments.physical-input]
bindings.sensor = { package = "physical-input", component = "sensor" }
execution = { fast-forward = false }

[deployments.physical-input.federates.host]
groups = ["placement/sensor"]
runtime = "std"
recovery = "fail-stop"

physical-clock.domain = 7

physical-inputs.max_batch_values = 1
physical-inputs.max_staged_batches = 1

physical-inputs.sources.plant = { component = "sensor", required = true }
