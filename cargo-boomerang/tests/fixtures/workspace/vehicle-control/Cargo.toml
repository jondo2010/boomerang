[package]
name = "vehicle-control"
version = "0.1.0"
edition = "2021"
[features]
default = ["hosted"]
hosted = ["boomerang/hosted"]
metadata = ["boomerang/hosted"]
payload = []
broken-payload = ["hosted"]
broken-descriptor = ["hosted"]
controller-selected = ["hosted"]
sensor-selected = ["hosted"]
profile-config-probe = ["hosted"]
warning-diagnostic = ["hosted"]

[dependencies]
boomerang = { path = "../../../../../boomerang", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(boomerang_facet, values("descriptor", "payload"))', "cfg(boomerang_cargo_config_probe)"] }
