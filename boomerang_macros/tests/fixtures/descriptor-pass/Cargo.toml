[package]
name = "descriptor-pass"
version = "0.0.0"
edition = "2021"
publish = false

[features]
default = ["boomerang/hosted"]
__boomerang_descriptor = ["boomerang/__boomerang_descriptor", "dep:boomerang_builder"]
__boomerang_payload = ["boomerang/__boomerang_payload"]
action-delay-overflow = []
action-duration-unit-overflow = []
binding-fingerprint-mismatch = []
binding-macro-abi-mismatch = []
invalid-action-attribute = []
invalid-action-duration = []
missing-state-init = []
payload-lexical-relation = []

[dependencies]
boomerang = { path = "../../../../boomerang", default-features = false }
boomerang_builder = { path = "../../../../boomerang_builder", features = ["descriptor-fingerprint"], optional = true }

[workspace]
