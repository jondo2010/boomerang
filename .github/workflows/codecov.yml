name: Code Coverage

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Cargo target directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=target" >> "$GITHUB_ENV"

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate code coverage
        run: |
          cargo fetch
          cargo llvm-cov --no-report --all-features --workspace
          # Exercise the tool-owned facet cfg values independently of Cargo features.
          RUSTFLAGS='--cfg boomerang_facet="payload"' cargo llvm-cov --no-clean -p boomerang --lib --no-default-features
          RUSTFLAGS='--cfg boomerang_facet="descriptor"' cargo llvm-cov --no-clean -p boomerang --lib --no-default-features --features hosted
          # Generated workspaces fall outside cargo-llvm-cov's object discovery.
          # Use Cargo outputs; publication tests deliberately corrupt bundled copies.
          objects=()
          while IFS= read -r -d '' launcher; do
            objects+=("-object=$launcher")
          done < <(find target/llvm-cov-target/tmp -path '*/b/*' -type f -name boomerang-static-launcher -print0)
          test "${#objects[@]}" -gt 0
          LLVM_COV_FLAGS="${objects[*]}" cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: true
          use_oidc: true
