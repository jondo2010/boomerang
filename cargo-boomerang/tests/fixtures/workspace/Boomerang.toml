schema = 1

[topology]
package = "vehicle-topology"
entry = "vehicle_topology::topology"

[deployments.production.bindings.sensor]
package = "sensor-host"
features = ["simulated"]

[deployments.production.bindings.controller]
package = "vehicle-control"
[deployments.production.bindings.backup]
package = "vehicle-control"

[deployments.production.federates.host]
groups = ["placement/backup", "placement/controller", "placement/sensor"]
runtime = "std"

[deployments.runtime-failure]
bindings = { sensor = { package = "sensor-host", features = ["simulated", "runtime-failure"] }, controller = { package = "vehicle-control" }, backup = { package = "vehicle-control" } }

[deployments.runtime-failure.federates.host]
groups = ["placement/backup", "placement/controller", "placement/sensor"]
runtime = "std"

[deployments.execution]
bindings = { sensor = { package = "sensor-host", features = ["simulated"] }, controller = { package = "vehicle-control" }, backup = { package = "vehicle-control" } }

[deployments.execution.federates.host]
groups = ["placement/backup", "placement/controller", "placement/sensor"]
runtime = "std"

[deployments.execution.execution]
fast-forward = true
keep-alive = true
logical-horizon = "1000ms"

[deployments.execution-equivalent]
bindings = { sensor = { package = "sensor-host", features = ["simulated"] }, controller = { package = "vehicle-control" }, backup = { package = "vehicle-control" } }

[deployments.execution-equivalent.federates.host]
groups = ["placement/backup", "placement/controller", "placement/sensor"]
runtime = "std"

[deployments.execution-equivalent.execution]
fast-forward = true
keep-alive = true
logical-horizon = "1s"

[deployments.broken-payload.bindings.sensor]
package = "sensor-host"
features = ["simulated"]

[deployments.broken-payload.bindings.controller]
package = "vehicle-control"
features = ["broken-payload"]
[deployments.broken-payload.bindings.backup]
package = "vehicle-control"

[deployments.broken-payload.federates.host]
groups = ["placement/backup", "placement/controller", "placement/sensor"]
runtime = "std"

[deployments.profile-config.bindings.sensor]
package = "sensor-host"
features = ["simulated"]

[deployments.profile-config.bindings.controller]
package = "vehicle-control"
features = ["profile-config-probe"]

[deployments.profile-config.bindings.backup]
package = "vehicle-control"

[deployments.profile-config.federates.host]
groups = ["placement/backup", "placement/controller", "placement/sensor"]
runtime = "std"
profile = "release"
cargo-config = ".cargo/profile-config.toml"

[deployments.resolution.bindings.sensor]
package = "sensor-host"
features = ["simulated"]

[deployments.resolution.bindings.controller]
package = "vehicle-control"
[deployments.resolution.bindings.backup]
package = "vehicle-control"

[deployments.resolution.federates.host]
groups = ["placement/backup", "placement/controller", "placement/sensor"]
target = "x86_64-unknown-linux-gnu"
runtime = "std"
target-json = "targets/host.json"
cargo-config = ".cargo/host.toml"

[deployments.outside-member.bindings."vehicle/sensor"]
package = "outside-member"

[deployments.outside-member.federates.host]
groups = ["vehicle"]
runtime = "std"

[deployments.payload-alias.bindings."vehicle/sensor"]
package = "sensor-host"
features = ["payload-alias"]
[deployments.payload-alias.federates.host]
groups = ["vehicle"]
runtime = "std"

[deployments.feature-union.bindings.controller]
package = "vehicle-control"
features = ["controller-selected"]
[deployments.feature-union.bindings.backup]
package = "vehicle-control"
features = ["sensor-selected"]
[deployments.feature-union.bindings.sensor]
package = "sensor-host"
features = ["simulated"]
[deployments.feature-union.federates.host]
groups = ["placement/backup", "placement/controller", "placement/sensor"]
runtime = "std"
