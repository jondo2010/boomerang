schema = 1

[topology]
package = "snake"
entry = "snake::topology"

[deployments.snake]
telemetry = "hosted"
bindings.snake = { package = "snake-game", component = "game", features = ["hosted"] }
bindings.keyboard = { package = "snake-keyboard", component = "keyboard", features = ["hosted"] }

federates.host = { groups = [
    "placement/keyboard",
    "placement/snake",
], runtime = "std", recovery = "fail-stop" }

execution = { fast-forward = false, keep-alive = true }
