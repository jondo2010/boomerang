name: Code Coverage

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Cargo target directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=target" >> "$GITHUB_ENV"

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate code coverage
        run: |
          cargo llvm-cov --no-report --all-features --workspace --exclude boomerang --exclude cargo-boomerang
          cargo llvm-cov --no-clean -p boomerang --features hosted,serde,parallel,replay
          cargo llvm-cov --no-clean -p boomerang --lib --no-default-features --features __boomerang_payload
          cargo llvm-cov --no-clean -p boomerang --lib --no-default-features --features __boomerang_descriptor
          cargo llvm-cov --no-clean --all-features -p cargo-boomerang --lib --bins --test manifest --test workspace
          cargo llvm-cov --no-clean -p cargo-boomerang --test toolchain -- run::generated_monolith_matches_owned_reference_execution_summary --exact
          # The launcher lives in an independent generated workspace, outside
          # cargo-llvm-cov's object discovery. Include its instrumented helpers.
          launchers=(target/llvm-cov-target/tmp/cargo-boomerang-fixtures/toolchain/boomerang/production/*/artifacts/host/boomerang-static-launcher)
          test "${#launchers[@]}" -eq 1
          test -f "${launchers[0]}"
          LLVM_COV_FLAGS="-object=${launchers[0]}" cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: true
          use_oidc: true
