[package]
name = "snake"
description = "Host topology declarations for the compiled Snake examples"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"

[dependencies]
boomerang = { workspace = true }
snake-game = { path = "game" }
snake-keyboard = { path = "keyboard" }

[dev-dependencies]
serde_json.workspace = true
boomerang_builder = { workspace = true, features = ["host-interchange"] }
