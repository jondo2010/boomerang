[package]
name = "descriptor-pass"
version = "0.0.0"
edition = "2021"
publish = false

[features]
default = ["boomerang/hosted"]
action-delay-overflow = []
action-duration-unit-overflow = []
binding-fingerprint-mismatch = []
binding-macro-abi-mismatch = []
invalid-action-attribute = []
invalid-action-duration = []
missing-state-init = []
payload-lexical-relation = []

[dependencies]
boomerang = { path = "../../../../boomerang", default-features = false }

[target.'cfg(boomerang_facet = "descriptor")'.dev-dependencies]
boomerang_builder = { path = "../../../../boomerang_builder", features = ["descriptor-fingerprint"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(boomerang_facet, values("descriptor", "payload"))'] }

[workspace]
