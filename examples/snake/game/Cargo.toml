[package]
name = "snake-game"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["dynamic"]
dynamic = ["boomerang/builder", "dep:rand"]
metadata = ["boomerang/builder"]
payload = ["dep:rand"]

[dependencies]
boomerang = { path = "../../../boomerang", default-features = false }
crossterm = "0.29"
rand = { version = "0.9", optional = true }
