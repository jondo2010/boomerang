# Deliberate legacy feature probes; normal fixture components have no facet features.
[package]
name = "transitive-host"
version = "0.1.0"
edition = "2021"
[features]
__boomerang_descriptor = []
__boomerang_payload = ["dep:legacy-peer", "legacy-peer/__boomerang_payload"]
payload-alias = ["__boomerang_payload"]
[dependencies]
sensor-host = { path = "../sensor-host", default-features = false }
legacy-peer = { path = "../legacy-peer", optional = true }
