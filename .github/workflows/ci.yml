name: CI

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main", "codex/deployment-phase4-integration", "codex/deployment-phase5-integration", "codex/deployment-phase6-integration"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Commitlint
    steps:
      - name: Run commitlint
        uses: opensource-nepal/commitlint@v1

  clippy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Clippy
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Configure Cargo target directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=target" >> "$GITHUB_ENV"
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Check with Clippy
        run: |
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          RUSTFLAGS='--cfg boomerang_facet="payload"' cargo clippy -p boomerang --lib --no-default-features -- -D warnings
          RUSTFLAGS='--cfg boomerang_facet="descriptor"' cargo clippy -p boomerang --lib --no-default-features --features hosted -- -D warnings

  test:
    strategy:
      matrix:
        toolchain: [stable, nightly]
        os: [windows-latest, ubuntu-latest, macos-latest]

        # Only test nightly on Linux
        exclude:
          - os: macos-latest
            toolchain: nightly
          - os: windows-latest
            toolchain: nightly

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - name: Configure Cargo target directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=target" >> "$GITHUB_ENV"
      - name: fetch Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: toolchain version
        run: cargo -vV

      - name: prime generated-workspace dependency cache
        run: cargo fetch

      - name: test workspace except cargo-boomerang
        run: cargo test --workspace --exclude cargo-boomerang --verbose

      - name: test cargo-boomerang fast targets
        run: >-
          cargo test -p cargo-boomerang --lib --bin cargo-boomerang
          --test manifest --test workspace --verbose

      # Generated builds dominate runtime (23 minutes on Windows). Exercise the
      # full suite once, and keep the CLI/owned-execution smoke test portable.
      - name: test cargo-boomerang toolchain
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
        run: cargo test -p cargo-boomerang --test toolchain -- --test-threads=1

      - name: smoke test cargo-boomerang toolchain
        if: matrix.os != 'ubuntu-latest' || matrix.toolchain != 'stable'
        run: >-
          cargo test -p cargo-boomerang --test toolchain --
          run::generated_monolith_cli_matches_owned_execution --exact

      - name: discard disposable fixture builds before caching
        shell: bash
        # Each test binary recreates these directories, so restoring them cannot help.
        run: rm -rf target/tmp/cargo-boomerang-fixtures

  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - name: Configure Cargo target directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=target" >> "$GITHUB_ENV"
      - name: fetch Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: miri
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Test with Miri
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo +nightly miri nextest run -p boomerang -p boomerang_runtime -E 'kind(test)'
