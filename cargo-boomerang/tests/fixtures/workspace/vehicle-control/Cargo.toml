[package]
name = "vehicle-control"
version = "0.1.0"
edition = "2021"

[features]
default = ["boomerang/hosted"]
__boomerang_descriptor = ["boomerang/__boomerang_descriptor"]
__boomerang_payload = ["boomerang/__boomerang_payload"]
broken-payload = []
broken-descriptor = []
controller-selected = []
sensor-selected = []
profile-config-probe = []
warning-diagnostic = []

[dependencies]
boomerang = { path = "../../../../../boomerang", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(boomerang_cargo_config_probe)"] }
