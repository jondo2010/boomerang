[package]
name = "boomerang_tinymap"
description = "A tiny, fast, and simple Slotkey-type map implementation for Boomerang."
version.workspace = true
readme = "README.md"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true

[features]
default = ["alloc", "serde"]
alloc = ["dep:fixedbitset"]
std = ["alloc", "fixedbitset/std"]

## Support for serialization
serde = ["dep:serde", "alloc"]

[dependencies]
document-features = { workspace = true }
fixedbitset = { version = "0.5", optional = true, default-features = false }
serde = { version = "1.0", optional = true, default-features = false, features = ["derive", "alloc"] }

[dev-dependencies]
itertools = { workspace = true }
serde_json = "*"
