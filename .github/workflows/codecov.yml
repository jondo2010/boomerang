name: Code Coverage

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    # Native fixtures compile instrumented application binaries.
    timeout-minutes: 60

    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Cargo target directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=target" >> "$GITHUB_ENV"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Fetch dependencies
        run: cargo fetch

      - name: Collect workspace coverage
        run: cargo llvm-cov --no-report --all-features --workspace

      - name: Generate LCOV report
        shell: bash
        run: |
          # Nested Cargo fixtures fall outside cargo-llvm-cov's object discovery.
          # Collect original executables rather than test evidence copies.
          objects=()
          native_objects=0
          while IFS= read -r -d '' executable; do
            objects+=("-object=$executable")
            native_objects=$((native_objects + 1))
          done < <(find target/llvm-cov-target/native-fixtures -path '*/debug/deps/*' -type f -perm /111 ! -name '*.*' -print0)
          test "$native_objects" -gt 0
          LLVM_COV_FLAGS="${objects[*]}" cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: true
          use_oidc: true
